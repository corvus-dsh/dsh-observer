# CI — rebuild, prove the committed artifact is current, then test.
#
# `index.js` is committed build output. A green suite against `src/` combined with a stale bundle is
# the "tests green, product broken" case; CI rebuilds and diffs to make it impossible.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show the runtime we are actually testing on
        run: node --version && npm --version

      - name: Check out the layer this plugin writes through
        # ── WHY A SIBLING CHECKOUT AND NOT A SKIP ────────────────────────────────────────────
        #
        # This plugin's job is to write a session THROUGH `dsh-paradise`. Its async tests are not
        # "nice to have": they are the only place the write path is exercised end to end. Skipping
        # them when the layer is absent would leave CI green while never testing the one thing this
        # package does — the failure mode that makes a green badge worthless.
        #
        # `dsh-paradise` lives in a sibling repository, so it is checked out BESIDE this one. That is
        # the same layout the workspace uses locally, which means CI and a developer machine resolve
        # the layer through the identical path.
        #
        # ⚠️ The checkout path MUST stay INSIDE this job's workspace. `actions/checkout` refuses a
        # destination it cannot prove is under `$GITHUB_WORKSPACE`:
        #
        #   Repository path '/home/runner/work/dsh-observer/dsh-paradise-checkout'
        #   is not under '/home/runner/work/dsh-observer/dsh-observer'
        #
        # So it lands in a staging directory inside the workspace and the next step MOVES it out to
        # the sibling position. `mv` is a plain filesystem rename — the runner user owns the parent
        # directory — so the layout the probe wants is reached without asking checkout to leave home.
        uses: actions/checkout@v4
        with:
          repository: corvus-dsh/dsh-paradise
          path: .siblings/dsh-paradise

      - name: Place the layer where the sibling probe expects it
        # The bridge tries `@corvus-dsh/dsh-paradise` (package specifier) then `../dsh-paradise`
        # (sibling directory). CI has no installed package, so the sibling probe must succeed — and
        # it looks for the DIRECTORY NAME `dsh-paradise`, not the scoped package name.
        run: |
          set -e
          mv .siblings/dsh-paradise ../dsh-paradise
          rm -rf .siblings
          node -e "console.log('layer at', require('node:fs').realpathSync('../dsh-paradise/index.js'))"

      - name: Runtime dependencies are empty and dev tooling is allowlisted
        # B4-A 的「依赖为空门禁」。dependencies 会被装进用户的运行时，必须永远为空；
        # typescript 只能是精确锁版本的 devDependency（干净克隆里缺它的代价已实测）。
        run: node scripts/check-runtime-deps.mjs

      - name: Install (no dependencies expected)
        run: npm install --no-audit --no-fund

      - name: Prove the PUBLISHED layer resolves, not just the sibling
        # ── WHY THIS EXISTS IN ADDITION TO THE SIBLING CHECKOUT ─────────────────────────────────
        #
        # The sibling checkout above proves the PLUGIN works against this repository's HEAD of
        # `dsh-paradise`. It does not prove that a USER who installs the published package can reach
        # the layer, and those are different questions:
        #
        #   sibling  -> `../dsh-paradise/index.js`   (our own probe path, works in CI)
        #   published -> `@corvus-dsh/dsh-paradise`  (what a real install produces)
        #
        # The bridge tries the PACKAGE SPECIFIER FIRST, so a published install resolves without any
        # sibling at all. If the published package were missing a `main`, had a broken `exports`
        # map, or was never published, the user's plugin would die at load with
        # PARADISE_WRITE_UNAVAILABLE — and CI would still be green, because CI only ever tested
        # the sibling path.
        #
        # So this step asks the registry the same question a consumer asks, and treats the three
        # answers differently. `not published yet` is NOT a failure: before the first release there
        # is nothing to install, and failing here would make the very first publish impossible.
        # What must fail is the ambiguous state — the registry says it exists but npm cannot install
        # it — because that is a package that will break every user.
        run: |
          set -e
          echo "── registry view of the peer dependency ──"
          if ! npm view @corvus-dsh/dsh-paradise versions --json --registry=https://registry.npmjs.org > /tmp/view.txt 2>/tmp/view.err; then
            if grep -q 'E404' /tmp/view.err; then
              echo "::notice::@corvus-dsh/dsh-paradise is NOT PUBLISHED YET — skipping the install probe."
              echo "Sibling checkout remains the only resolution path until the first release."
              exit 0
            fi
            echo "::error::registry lookup failed for a reason that is not 404:"
            cat /tmp/view.err
            exit 1
          fi
          # ── THE STAGING PLACEHOLDER IS NOT A RELEASE OF THIS CODE ────────────────────────────────
          # `npm stage publish` claims a brand-new name by publishing a PLACEHOLDER package whose
          # version is exactly `0.0.0-stage`. It is a real, installable version of the real name, and
          # it carries NO `main` and NO `exports` — because it is not a build of this repository at
          # all.
          #
          # MEASURED, and it is why this filter exists: before the placeholder, `npm view … version`
          # answered E404 and this gate skipped. With the placeholder live, the lookup SUCCEEDS, the
          # probe installs it, and `require('@corvus-dsh/dsh-paradise')` dies with MODULE_NOT_FOUND:
          #
          #     Error: Cannot find module '@corvus-dsh/dsh-paradise'
          #
          # …so CI would go red for a reason that has nothing to do with the code under test.
          #
          # THE FILTER IS BY EXACT VERSION, NOT BY "ANY PRE-RELEASE": a genuine `0.9.0-beta.1` MUST
          # still be probed, and that is the release this gate exists to protect.
          PUBLISHED="$(tr -d '\n ' < /tmp/view.txt | grep -o '"[^"]*"' | tr -d '"' | grep -vx '0.0.0-stage' | tail -1 || true)"
          if [ -z "$PUBLISHED" ]; then
            echo "::notice::only the staging placeholder (0.0.0-stage) exists — there is no release to verify yet."
            echo "The first real release will be probed here."
            exit 0
          fi
          echo "published version to verify: $PUBLISHED"

          echo "── install it the way a consumer does ──"
          PROBE="$(mktemp -d)"
          cd "$PROBE"
          npm init -y > /dev/null
          if ! npm install --no-audit --no-fund "@corvus-dsh/dsh-paradise@$PUBLISHED" > /tmp/inst.txt 2>&1; then
            echo "::error::the published package exists but CANNOT BE INSTALLED — every consumer would hit this"
            cat /tmp/inst.txt
            exit 1
          fi
          echo "── and can it actually be imported? ──"
          node -e "const m=require('@corvus-dsh/dsh-paradise'); const need=['readDiskEvents','escapeSessionDirName','createDshAdapters']; const miss=need.filter(k=>typeof m[k]!=='function'); if(miss.length){console.error('missing exports:',miss);process.exit(1)} console.log('published layer exports ok:', need.join(', '))"
      - name: Build
        run: npm run build

      - name: The build must not leave the committed artifact stale
        # WHY `git diff --exit-code` AND NOT `git status --porcelain`
        #
        # `git status` answers "does the file differ from what the stat cache remembers", and with
        # `core.autocrlf=true` (the default on a Windows clone) it can answer YES for a file whose
        # CONTENT is byte-identical to the committed blob — git wants to convert the worktree file to
        # CRLF "the next time it touches it", and reports the pending conversion as a modification.
        #
        # Measured on a fresh clone of this repo: after `npm run build`, `git hash-object index.js`
        # equals the committed blob exactly, `git diff --exit-code` exits 0 — and `git status
        # --porcelain` still prints ` M index.js`. A staleness gate built on `status` would fail a
        # perfectly current artifact on every Windows machine.
        #
        # `git diff --exit-code` compares content after the repo's configured filters, which is the
        # same normalization `git status` applies — so it agrees with `status` on real edits but not
        # on pending-EOL noise. That is exactly the discrimination this gate needs.
        #
        # ⚠️ DO NOT "fix" this by pinning `core.autocrlf=false`. That disables the normalization
        # instead of relying on it, and on a worktree with CRLF bytes it turns pure EOL churn into a
        # whole-file diff. Measured on dsh-memory: `lib/index.js` has 1664 CR bytes in the worktree,
        # plain `git diff` exits 0, and `git -c core.autocrlf=false diff` reports 7 files changed /
        # 7674 insertions / 7674 deletions of NOTHING.
        run: |
          if ! git diff --exit-code -- index.js; then
            echo "::error::The build changed committed artifacts. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- index.js
            exit 1
          fi
          echo "ok: index.js matches the committed artifact"

      - name: Syntax-check the shipped entry point
        run: node --check index.js

      # ── PREFLIGHT RAN LOCALLY AND NEVER ON A PUSH ───────────────────────────────────────────────
      #
      # Measured 2026-11-21 by `scripts/check-check-parity.mjs`: `npm run check` starts with

      # ── TD-B1: THE SHIPPED BUNDLE MUST BE WHAT THIS SOURCE BUILDS ─────────────────────────────
      #
      # Measured before this step existed: this repository had ZERO artifact scripts, so
      # 「the shipped bundle is the source」 was a claim nobody could check without a human
      # rebuild and a visual diff. The script rebuilds, then compares every artifact git TRACKS
      # byte for byte — the set that ships is the INDEX's set, not a glob of the build's.
      - name: artifact freshness (committed bundle == source build)
        run: node scripts/check-artifact-fresh.mjs
      # `node scripts/preflight.mjs` and this file did not mention it. `preflight` is not decoration —
      # it is the check that the package's declared surface matches what is on disk — and it is the
      # FIRST step of the local gate chain, so the local chain began with something CI never ran.
      #
      # It runs BEFORE `npm test` here (LOCAL order), not after: the local chain puts it first because
      # a malformed manifest makes every later answer meaningless.
      - name: Preflight (manifest and entry points agree)
        run: npm run preflight

      - name: Test
        run: npm test

      # ── THE GATES THAT HAD NO ENTRY POINT ───────────────────────────────────────────────────────
      #
      # Measured 2026-11-16, before this step: `type-budget`, `check-cycles`, `check-readme-counts`,
      # `verify-bundle-purity` and `verify-pure-move` were all present in `scripts/` and NONE of them
      # appeared in `package.json`, in this file, in `test/`, or as a call from another script.
      # They had never run on a push. In this repository's own words: "A gate nobody runs is a comment."
      #
      # Order matters and is not alphabetical: a broken dependency graph or a type regression is a
      # CAUSE, a stale README count is a SYMPTOM. Same reasoning as graft-slice's CI, which also runs
      # the documentation gate after `npm test`.
      #
      # They run AFTER `npm test` on purpose: a behavioural break should fail with a test name to
      # read, not with a documentation mismatch that is one of its symptoms.
      - name: Gates (previously unwired)
        # `check-cycles` and `check-readme-counts` exit non-zero on failure and 0 on success — they
        # need no wrapper. `type-budget` exits **2** on a machine without a compiler, which is every
        # CI run here (`package.json` declares no dependencies), so it goes through `run-gate.mjs`:
        # RESOURCE ⇒ printed loudly + exit 0; FAIL ⇒ exit 1. See docs/gate-wiring.md §三.
        run: |
          node scripts/check-cycles.mjs
          node scripts/run-gate.mjs scripts/type-budget.mjs
          node scripts/check-readme-counts.mjs
          # Test-file numbers must be unique WITHIN this repository (B4-0b-2 W5-1). Measured
          # 2026-11-21: one number (`v274`) is already shared; that stock is baselined and any NEW
          # collision fails. Same shape as the count gate above: the stock is recorded, growth is
          # refused.
          node scripts/check-test-numbers.mjs
          # Test numbers must also be unique WITHIN this repository (B4-0b-2 W5-1). Already shared:
          # one number. That stock is baselined; a NEW collision fails.
          node scripts/check-check-parity.mjs

      - name: Bundle purity (vs the previous commit)
        # ⚠️ THIS STEP IS NOT RED ON EVERY PUSH, AND THAT IS NOT A SKIP.
        #
        # `verify-bundle-purity.mjs` correctly exits 2 when there is nothing to compare: most commits
        # here do not touch the built `index.js`, so `--before HEAD~1` is byte-identical and the
        # instrument says `VACUOUS`. A shallow clone has no `HEAD~1` at all — the other exit-2 case.
        #
        # `bundle-purity-guard.mjs` translates that ONE condition into `RESOURCE — … NOT CHECKED this
        # run` + exit 0, and passes exit 1 (NOT PURE) straight through. The red path is proven
        # reachable: `--before 5d32faf~1` reports 2 differing code lines, `--before 7abbd73~1` 602.
        # Evidence and the full exit-code table: docs/gate-wiring.md §二.
        run: node scripts/bundle-purity-guard.mjs

      - name: Pure-move checker self-test
        # `verify-pure-move.mjs` is NOT wired as a gate, and that is a written decision rather than an
        # omission: measured over the last 40 commits, `--against <parent>` gives PURE=0, RESOURCE=2,
        # NOT-PURE=38 — this repository has never made a pure move, so the checker has no subject and
        # would either cry wolf or say nothing. What CAN be verified on every push is that the checker
        # itself still discriminates: its `--self-test` must report `SELF-TEST PASS`.
        # Reasoning and the 40-commit measurement: docs/gate-wiring.md §四.
        run: node scripts/verify-pure-move.mjs --self-test

