# CI — rebuild, prove the committed artifact is current, then test.
#
# `index.js` is committed build output. A green suite against `src/` combined with a stale bundle is
# the "tests green, product broken" case; CI rebuilds and diffs to make it impossible.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show the runtime we are actually testing on
        run: node --version && npm --version

      - name: Check out the layer this plugin writes through
        # ── WHY A SIBLING CHECKOUT AND NOT A SKIP ────────────────────────────────────────────
        #
        # This plugin's job is to write a session THROUGH `dsh-paradise`. Its async tests are not
        # "nice to have": they are the only place the write path is exercised end to end. Skipping
        # them when the layer is absent would leave CI green while never testing the one thing this
        # package does — the failure mode that makes a green badge worthless.
        #
        # `dsh-paradise` lives in a sibling repository, so it is checked out BESIDE this one. That is
        # the same layout the workspace uses locally, which means CI and a developer machine resolve
        # the layer through the identical path.
        #
        # ⚠️ The checkout path MUST stay INSIDE this job's workspace. `actions/checkout` refuses a
        # destination it cannot prove is under `$GITHUB_WORKSPACE`:
        #
        #   Repository path '/home/runner/work/dsh-observer/dsh-paradise-checkout'
        #   is not under '/home/runner/work/dsh-observer/dsh-observer'
        #
        # So it lands in a staging directory inside the workspace and the next step MOVES it out to
        # the sibling position. `mv` is a plain filesystem rename — the runner user owns the parent
        # directory — so the layout the probe wants is reached without asking checkout to leave home.
        uses: actions/checkout@v4
        with:
          repository: corvus-dsh/dsh-paradise
          path: .siblings/dsh-paradise

      - name: Place the layer where the sibling probe expects it
        # The bridge tries `@corvus-dsh/dsh-paradise` (package specifier) then `../dsh-paradise`
        # (sibling directory). CI has no installed package, so the sibling probe must succeed — and
        # it looks for the DIRECTORY NAME `dsh-paradise`, not the scoped package name.
        run: |
          set -e
          mv .siblings/dsh-paradise ../dsh-paradise
          rm -rf .siblings
          node -e "console.log('layer at', require('node:fs').realpathSync('../dsh-paradise/index.js'))"

      - name: Install (no dependencies expected)
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: The build must not leave the committed artifact stale
        # WHY `git diff --exit-code` AND NOT `git status --porcelain`
        #
        # `git status` answers "does the file differ from what the stat cache remembers", and with
        # `core.autocrlf=true` (the default on a Windows clone) it can answer YES for a file whose
        # CONTENT is byte-identical to the committed blob — git wants to convert the worktree file to
        # CRLF "the next time it touches it", and reports the pending conversion as a modification.
        #
        # Measured on a fresh clone of this repo: after `npm run build`, `git hash-object index.js`
        # equals the committed blob exactly, `git diff --exit-code` exits 0 — and `git status
        # --porcelain` still prints ` M index.js`. A staleness gate built on `status` would fail a
        # perfectly current artifact on every Windows machine.
        #
        # `git diff --exit-code` compares content after the repo's configured filters, which is the
        # same normalization `git status` applies — so it agrees with `status` on real edits but not
        # on pending-EOL noise. That is exactly the discrimination this gate needs.
        #
        # ⚠️ DO NOT "fix" this by pinning `core.autocrlf=false`. That disables the normalization
        # instead of relying on it, and on a worktree with CRLF bytes it turns pure EOL churn into a
        # whole-file diff. Measured on dsh-memory: `lib/index.js` has 1664 CR bytes in the worktree,
        # plain `git diff` exits 0, and `git -c core.autocrlf=false diff` reports 7 files changed /
        # 7674 insertions / 7674 deletions of NOTHING.
        run: |
          if ! git diff --exit-code -- index.js; then
            echo "::error::The build changed committed artifacts. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- index.js
            exit 1
          fi
          echo "ok: index.js matches the committed artifact"

      - name: Syntax-check the shipped entry point
        run: node --check index.js

      - name: Test
        run: npm test
