# dsh-observer — insert the plugin row.
#
# The patch follows the same shape as the other local plugins: one insert with the id, the
# package name, and the config. `bindingsPath` is optional — when omitted the plugin uses
# <profile>/data/dsh-observer/observer-bindings.json.
- insert:
    - id: dsh-observer
      # v2.1.0: the npm name is scoped, so the loader must resolve the SCOPED path. The `id`
      # stays bare because it is a stable handle other patches refer to.
      name: '@corvus-dsh/dsh-observer'
      config:
        bindingsPath: ''
